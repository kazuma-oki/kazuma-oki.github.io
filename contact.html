<main id="main">
<section class="page contact-page">
  <div class="contact-inner">
    <form class="contact-form" id="contactForm" method="post" action="" target="hidden_iframe">
      <div class="field">
        <label class="field-label" for="f-name">フルネーム<span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="f-name" name="name" placeholder="例：山田　太郎" required>
      </div>
      <div class="field">
        <label class="field-label" for="f-email">Email<span class="required" aria-hidden="true">*</span></label>
        <input type="email" id="f-email" name="email" placeholder="例：example@co.jp" required>
      </div>
      <div class="field">
        <label class="field-label" for="f-message">ご連絡・お問い合わせ内容<span class="required" aria-hidden="true">*</span></label>
        <textarea id="f-message" name="message" placeholder="ここに内容を入力してください。" required></textarea>
      </div>
      <button class="submit" type="submit" disabled>送信</button>
      <p class="form-notice">※送信先が未設定です。data/site.json の googleForm を設定すると有効になります。</p>
    </form>

    <div class="contact-thanks" id="contactThanks" hidden>
      <p class="thanks-title">送信ありがとうございました</p>
      <p class="thanks-text">内容を確認のうえ、折り返しご連絡いたします。</p>
    </div>
  </div>
  <iframe name="hidden_iframe" id="hidden_iframe" title="送信先" style="display:none" aria-hidden="true"></iframe>
</section>
