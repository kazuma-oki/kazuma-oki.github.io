<article class="work-detail">
  <p class="back-link"><a href="{{base}}index.html#work"><span class="back-arrow" aria-hidden="true"></span>Works一覧に戻る</a></p>

  <div class="detail-inner">
    <p class="detail-meta">
      <span class="detail-category">{{category}}｜{{tag}}</span>
      <span class="detail-date">{{date}}</span>
    </p>
    <h1 class="detail-title">{{title}}</h1>

    {{mainImageBlock}}

    <div class="detail-body">
      {{sections}}
    </div>
  </div>
</article>
